`Dean`,text:`Your grades are too high. The ministry looks at averages, and so do I.`,ex:{id:`dean`,ex:`neutral`}},{t:`line`,who:`Dean`,text:`Nothing above 95 this semester. I trust you understand.`,ex:{id:`dean`,ex:`angry`}},{t:`choice`,chapter:`Week 3 · The Ceiling`,prompt:`What do you tell the dean?`,options:[{label:`Understood. (Cap the grades and say nothing.)`,card:`ch1_silent`,goto:`ch1_after`,flags:[`dn_silent`],react:{id:`dean`,ex:`happy`},effects:[{who:`teacher`,stat:`deanRep`,delta:20},{who:`teacher`,stat:`energy`,delta:5},{who:`akmaral`,stat:`motivation`,delta:-10},{who:`madiyar`,stat:`motivation`,delta:-8},{who:`makhambet`,stat:`motivation`,delta:-8},{who:`rakhat`,stat:`motivation`,delta:-8},{who:`rakhat`,stat:`trust`,delta:-10}]},{label:`Fine, but I will publish exactly what 95+ work looks like.`,card:`ch1_explain`,goto:`ch1_after`,flags:[`dn_explain`],react:{id:`dean`,ex:`neutral`},effects:[{who:`teacher`,stat:`deanRep`,delta:5},{who:`teacher`,stat:`energy`,delta:-10},{who:`akmaral`,stat:`trust`,delta:8},{who:`madiyar`,stat:`trust`,delta:8},{who:`makhambet`,stat:`trust`,delta:8},{who:`rakhat`,stat:`trust`,delta:8},{who:`akmaral`,stat:`knowledge`,delta:5}]},{label:`No. I grade by the rubric, not by the average.`,card:`ch1_refuse`,goto:`ch1_after`,flags:[`dn_refuse`],remember:`The dean will remember this.`,react:{id:`dean`,ex:`angry`},effects:[{who:`teacher`,stat:`deanRep`,delta:-25},{who:`teacher`,stat:`energy`,delta:-5},{who:`akmaral`,stat:`trust`,delta:10},{who:`madiyar`,stat:`trust`,delta:10},{who:`makhambet`,stat:`trust`,delta:10},{who:`rakhat`,stat:`trust`,delta:10}]},{label:`Then I will give comments instead of numbers wherever I can.`,card:`ch1_comments`,goto:`ch1_after`,flags:[`dn_comments`],react:{id:`dean`,ex:`angry`},effects:[{who:`teacher`,stat:`deanRep`,delta:-15},{who:`teacher`,stat:`energy`,delta:-15},{who:`akmaral`,stat:`motivation`,delta:10},{who:`madiyar`,stat:`motivation`,delta:10},{who:`makhambet`,stat:`motivation`,delta:10},{who:`rakhat`,stat:`motivation`,delta:10},{who:`madiyar`,stat:`knowledge`,delta:5},{who:`rakhat`,stat:`knowledge`,delta:5}]}]},{t:`label`,id:`ch1_after`},{t:`scene`,bg:`hall_morning`,caption:`Next lecture`,actors:[{id:`rakhat`,ex:`neutral`,pos:`center`}]},{t:`line`,who:`Rakhat`,text:`So... is it true? Nobody gets above 95 this year?`,ex:{id:`rakhat`,ex:`neutral`}},{t:`if`,flag:`dn_silent`,then:`ch1_r_silent`},{t:`if`,flag:`dn_explain`,then:`ch1_r_explain`},{t:`if`,flag:`dn_refuse`,then:`ch1_r_refuse`},{t:`line`,who:null,text:`You hand back the quizzes. No numbers this time, just three comments on every page.`},{t:`line`,who:`Rakhat`,text:`Wait, you actually read it? ...Okay. That's new.`,ex:{id:`rakhat`,ex:`shocked`}},{t:`goto`,target:`ch2`},{t:`label`,id:`ch1_r_silent`},{t:`line`,who:null,text:`You change the subject. He notices.`},{t:`line`,who:`Rakhat`,text:`Got it. So it is true.`,ex:{id:`rakhat`,ex:`sad`}},{t:`goto`,target:`ch2`},{t:`label`,id:`ch1_r_explain`},{t:`line`,who:null,text:`You put the criteria on the screen: what a 90, a 95 and a 100 look like.`},{t:`line`,who:`Rakhat`,text:`Huh. So it is hard, but at least it is possible.`,ex:{id:`rakhat`,ex:`happy`}},{t:`goto`,target:`ch2`},{t:`label`,id:`ch1_r_refuse`},{t:`line`,who:null,text:`"If the work meets the rubric, it gets the grade. Whatever anyone says."`},{t:`line`,who:`Rakhat`,text:`Bold. I like bold. Hope you still work here in May.`,ex:{id:`rakhat`,ex:`happy`}},{t:`label`,id:`ch2`},{t:`scene`,bg:`hall_sunset`,caption:`Week 6 · The Group Project`,actors:[{id:`madiyar`,ex:`bored`,pos:`left`},{id:`akmaral`,ex:`neutral`,pos:`right`}]},{t:`line`,who:null,text:`After class. The room is empty except for two students from the same team.`},{t:`line`,who:`Akmaral`,text:`The report is good, right? Because I wrote it. All of it. Again.`,ex:{id:`akmaral`,ex:`angry`}},{t:`line`,who:`Akmaral`,text:`Check the edit history. Ninety percent is mine. Madiyar didn't even open the file.`,ex:{id:`akmaral`,ex:`sad`}},{t:`line`,wh ,ex:`happy`}},{t:`line`,who:`Madiyar`,text:`So it's a trial now. Great.`,ex:{id:`madiyar`,ex:`angry`}},{t:`goto`,target:`ch3r`},{t:`label`,id:`ch2_talk`},{t:`line`,who:`Akmaral`,text:`Fine. I will organise it. Like always.`,ex:{id:`akmaral`,ex:`sad`}},{t:`line`,who:`Madiyar`,text:`Wait, I have to explain the methodology part? ...Okay. Give me a day.`,ex:{id:`madiyar`,ex:`shocked`}},{t:`goto`,target:`ch3r`},{t:`label`,id:`ch2_prove`},{t:`line`,who:`Akmaral`,text:`You think I'm lying?`,ex:{id:`akmaral`,ex:`shocked`}},{t:`line`,who:`Akmaral`,text:`Here. Edit history, timestamps, everything. Happy now?`,ex:{id:`akmaral`,ex:`angry`}},{t:`label`,id:`ch3r`},{t:`scene`,bg:`corridor_rain`,caption:`Week 9 · The Deadline`,actors:[{id:`akmaral`,ex:`neutral`,pos:`left`},{id:`rakhat`,ex:`sad`,pos:`right`}]},{t:`line`,who:null,text:`Evening. Rain on the windows. Rakhat is waiting by your door, hood still wet.`},{t:`line`,who:`Rakhat`,text:`I was sick all week. Fever. I have maybe half the project done.`,ex:{id:`rakhat`,ex:`sad`}},{t:`line`,who:`Rakhat`,text:`Can I have one more week? The clinic note comes on Monday.`,ex:{id:`rakhat`,ex:`neutral`}},{t:`line`,who:null,text:`Akmaral is at the end of the corridor. She can hear everything.`},{t:`choice`,chapter:`Week 9 · The Deadline`,prompt:`What do you say?`,options:[{label:`Rules are rules. The deadline is the deadline.`,card:`ch3_strict`,goto:`ch3r_strict`,flags:[`rk_strict`],remember:`Rakhat will remember this.`,react:{id:`rakhat`,ex:`sad`},effects:[{who:`rakhat`,stat:`motivation`,delta:-20},{who:`rakhat`,stat:`trust`,delta:-15},{who:`teacher`,stat:`deanRep`,delta:5},{who:`teacher`,stat:`energy`,delta:5}]},{label:`(Quietly) Okay, take a week. Just between us.`,card:`ch3_quiet`,goto:`ch3r_quiet`,flags:[`rk_quiet`],remember:`Akmaral will remember this.`,react:{id:`rakhat`,ex:`happy`},effects:[{who:`rakhat`,stat:`trust`,delta:15},{who:`rakhat`,stat:`knowledge`,delta:5},{who:`akmaral`,stat:`trust`,delta:-10},{who:`madiyar`,stat:`motivation`,delta:-5}]},{label:`Take a week. And I will post one rule for everyone who is ill.`,card:`ch3_rule`,goto:`ch3r_rule`,flags:[`rk_rule`],react:{id:`rakhat`,ex:`happy`},effects:[{who:`rakhat`,stat:`trust`,delta:10},{who:`akmaral`,stat:`trust`,delta:5},{who:`madiyar`,stat:`trust`,delta:5},{who:`makhambet`,stat:`trust`,delta:5},{who:`teacher`,stat:`energy`,delta:-10},{who:`teacher`,stat:`deanRep`,delta:-5}]},{label:`Send me the half you have. I will comment, then you revise.`,card:`ch3_revise`,goto:`ch3r_revise`,flags:[`rk_revise`],remember:`Rakhat will remember this.`,react:{id:`rakhat`,ex:`shocked`},effects:[{who:`rakhat`,stat:`knowledge`,delta:15},{who:`rakhat`,stat:`motivation`,delta:5},{who:`teacher`,stat:`energy`,delta:-15}]}]},{t:`label`,id:`ch3r_strict`},{t:`line`,who:`Rakhat`,text:`Right. Sorry for asking.`,ex:{id:`rakhat`,ex:`sad`}},{t:`line`,who:`Akmaral`,text:`(quietly) Harsh. But at least it is the same for everyone.`,ex:{id:`akmaral`,ex:`neutral`}},{t:`goto`,target:`ch3`},{t:`label`,id:`ch3r_quiet`},{t:`line`,who:`Rakhat`,text:`Thank you. Seriously. I will not tell anyone.`,ex:{id:`rakhat`,ex:`happy`}},{t:`line`,who:`Akmaral`,text:`(to herself) So deadlines are negotiable now. Good to know.`,ex:{id:`akmaral`,ex:`angry`}},{t:`goto`,target:`ch3`},{t:`label`,id:`ch3r_rule`},{t:`line`,who:null,text:`That night you post it: one week extension for documented illness, same for everyone, reason stays private.`},{t:`line`,who:`Akmaral`,text:`Okay. That is actually fair.`,ex:{id:`akmaral`,ex:`happy`}},{t:`goto`,target:`ch3`},{t:`label`,id:`ch3r_revise`},{t:`line`,who:`Rakhat`,text:`Send it... unfinished? With all the mistakes?`,ex:{id:`rakhat`,ex:`shocked`}},{t:`line`,who:`Rakhat`,text:`...Okay. Better than starting over. Thanks.`,ex:{id:`rakhat`,ex:`happy`}},{t:`label`,id:`ch3`},{t:`scene`,bg:`desk_night`,caption:`Week 11 · The Perfect Essay`,actors:[]},{t:`line`,who:null,text:`01:12. Essay number 27 of 40. Your tea went cold an hour ago.`},{t:`line`,who:null,text:`Makhambet's essay. No typos. Perfect structure. Phrases like "a multifaceted tapestry of pedagogical paradigms".`},{t:`line`,who:null,text:`Last week he could not spell "paradigm".`},{t:`choice`,chapter:`Week 11 · The Perfect Essay`,prompt:`What do you do with it?`,options:[{label:`Give it a zero. This is ChatGPT.`,card:`ch3_zero`,goto:`ch3_zero`,flags:[`mk_zero`],remember:`Makhambet will remember this.`,effects:[{who:`makhambet`,stat:`trust`,delta:-25},{who:`makhambet`,stat:`motivation`,delta:-15},{who:`teacher`,stat:`deanRep`,delta:-30},{who:`teacher`,stat:`energy`,delta:5}]},{label:`Let it go. It's 1 a.m.`,card:`ch3_ignore`,goto:`ch3_ignore`,flags:[`mk_ignored`],effects:[{who:`makhambet`,stat:`knowledge`,delta:-10},{who:`makhambet`,stat:`motivation`,delta:5},{who:`teacher`,stat:`energy`,delta:10}]},{label:`Ask him to explain it in person tomorrow.`,card:`ch3_explain`,goto:`ch3_explain`,flags:[`mk_explained`],remember:`Makhambet will remember this.`,effects:[{who:`makhambet`,stat:`knowledge`,delta:15},{who:`makhambet`,stat:`trust`,delta:20},{who:`teacher`,stat:`energy`,delta:-25}]},{label:`Run it through an AI detector and report him.`,card:`ch3_detector`,goto:`ch3_detector`,flags:[`mk_detector`],remember:`Makhambet will remember this.`,effects:[{who:`teacher`,stat:`deanRep`,delta:10},{who:`teacher`,stat:`deanRep`,delta:-25},{who:`makhambet`,stat:`trust`,delta:-25},{who:`akmaral`,stat:`trust`,delta:-5},{who:`madiyar`,stat:`trust`,delta:-5},{who:`teacher`,stat:`energy`,delta:-20}]}]},{t:`label`,id:`ch3_zero`},{t:`scene`,bg:`hall_morning`,caption:`Two weeks later`,actors:[{id:`makhambet`,ex:`angry`,pos:`center`}]},{t:`line`,who:`Makhambet`,text:`I filed an appeal. You never asked me a single question about it.`,ex:{id:`makhambet`,ex:`angry`}},{t:`line`,who:null,text:`The appeal committee asks for evidence. You have a feeling.`},{t:`goto`,target:`finale`},{t:`label`,id:`ch3_ignore`},{t:`line`,who:null,text:`92 out of 100. Next essay. Nobody will ever know, including him.`},{t:`goto`,target:`finale`},{t:`label`,id:`ch3_explain`},{t:`scene`,bg:`hall_morning`,caption:`Next morning · Office hours`,actors:[{id:`makhambet`,ex:`shocked`,pos:`center`}]},{t:`line`,who:`Makhambet`,text:`You want me to... explain my own essay? Out loud?`,ex:{id:`makhambet`,ex:`shocked`}},{t:`line`,who:`Makhambet`,text:`Okay. The argument is mine. I used AI to check the structure and the grammar. The "tapestry" was its idea. Sorry.`,ex:{id:`makhambet`,ex:`sad`}},{t:`line`,who:`Makhambet`,text:`But ask me anything about the second section. I rewrote it four times.`,ex:{id:`makhambet`,ex:`happy`}},{t:`goto`,target:`finale`},{t:`label`,id:`ch3_detector`},{t:`scene`,bg:`hall_morning`,caption:`Two weeks later`,actors:[{id:`makhambet`,ex:`shocked`,pos:`center`}]},{t:`line`,who:`Makhambet`,text:`A website said 78%? That is the evidence?`,ex:{id:`makhambet`,ex:`shocked`}},{t:`line`,who:null,text:`The dean liked the report. The appeal committee didn't.`},{t:`label`,id:`finale`},{t:`scene`,bg:`exterior_evening`,caption:`Week 15 · Last day`,actors:[]},{t:`line`,who:null,text:`The last class is over. The campus lights come on one by one.`},{t:`scene`,bg:`exterior_evening`,actors:[{id:`artyom`,ex:`neutral`,pos:`center`}]},{t:`line`,who:`Artyom`,ex:{id:`artyom`,ex:`neutral`},text:`Thanks for the semester! Honest question though: did you trust us as much as you wanted us to trust you?`},{t:`line`,who:null,text:`Fifteen weeks. I wonder what they will remember.`},{t:`end`}],c={ch2_same:{title:`Equal grades, unequal work`,quote:`P3 also questions equal grades for unequal group contributions.`,source:`Interview P3 · Group essay, "Fairness and transparent criteria"`,tradeoff:`Keeps the peace today. Tells Akmaral that effort does not count.`},ch2_contrib:{title:`Make contribution visible`,quote:`Recording interviewing, reflective writing, and help with drafting makes responsibility more visible, although counting words alone would miss some work.`,source:`Group essay, "Fairness and transparent criteria"`,tradeoff:`Fair to the one who worked. Reading logs eats your evenings, and Madiyar feels judged, not taught.`},ch2_talk:{title:`Peer assessment helps... performance`,quote:`Double et al. (2020) ... found a small to moderate benefit of peer assessment for performance, g = 0.31. Improved performance does not establish emotional safety or perceived fairness.`,source:`Double, McGrane & Hopfenbeck (2020) · Shpringer (2026)`,tradeoff:`Madiyar has to explain his part and learns from it. Akmaral has to manage her team. Again.`},ch2_prove:{title:`Records are a basis, not a verdict`,quote:`Transparent records cannot remove every disagreement, but they provide a basis for discussing how individual effort relates to a shared outcome.`,source:`Group essay, "Fairness and transparent criteria"`,tradeoff:`The grade ends up correct. Being treated like a suspect does not feel fair.`},ch3_zero:{title:`A standard needs an explanation`,quote:`A demanding standard needs an explanation of what better work would look like and how it could receive a better result.`,source:`Group essay, "Grades and motivation"`,tradeoff:`Fast and firm. But a suspicion is not evidence, and an appeal will ask for evidence.`},ch3_ignore:{title:`Explain and check`,quote:`Saparbek (n.d.) stresses explaining and checking AI-assisted answers; Sagatove (n.d.) emphasises transparency.`,source:`Reflections: Saparbek, Sagatove · Group essay, "Creativity and AI"`,tradeoff:`No conflict, no time spent. And nobody ever finds out what he understood.`},ch3_explain:{title:`Make understanding inspectable`,quote:`We propose asking students to explain decisions, discuss revisions, and apply an idea to a new example. ... our material does not establish that they prevent misuse.`,source:`Group essay, "Creativity and AI"`,tradeoff:`Costs you an hour. Shows you what he actually understands.`},ch3_detector:{title:`Assess the capability, not the tool`,quote:`Our interpretation is that a task should idual circumstances. ... Shpringer (2026) frames such decisions through practical wisdom, while Sagatove (n.d.) asks whether consistency equals fairness.`,source:`Interviews P1–P3 · Reflections: Shpringer, Sagatove · Group essay`,tradeoff:`Nobody can call it favouritism. Rakhat loses a week of work to a fever.`},ch3_quiet:{title:`Flexibility needs reasons`,quote:`P1's warning about corruption also makes us consider how flexible decisions should be explained.`,source:`Interview P1 · Group essay, "Fairness and transparent criteria"`,tradeoff:`Kind to Rakhat. Everyone else learns that deadlines are negotiable if you ask the right way.`},ch3_rule:{title:`Record the reason`,quote:`We propose recording the relevant reason for an accommodation and its relationship to the assessed outcome. This would allow a student to understand why a deadline changed without requiring disclosure of another person's private circumstances.`,source:`Group essay, "Fairness and transparent criteria"`,tradeoff:`Fair and visible. Now you have a policy to maintain, and the dean asks why you wrote one.`},ch3_revise:{title:`Feedback that changes the next draft`,quote:`After removing extreme effects, they reported an average feedback effect of d = 0.48, with substantial variation and an important role for information content.`,source:`Wisniewski, Zierer & Hattie (2020)`,tradeoff:`He learns more from a rough draft with comments than from a late polished one. Your evenings disappear.`}},l=(e,n)=>t.reduce((t,r)=>t+e.students[r][n],0)/t.length;function u(e){return e.energy<25?`burnout`:e.deanRep<25?`deans_office`:l(e,`trust`)>=60&&l(e,`knowledge`)>=55?`remembered`:l(e,`knowledge`)>=55&&l(e,`motivation`)<45?`grade_machine`:`normies`}var d={remembered:{title:`The One They Remember`,text:`Years later, someone says your name in another classroom. Not because you were easy. Because you explained.`},grade_machine:{title:`Grade Machine`,text:`Good grades, clean statistics. As interviewee P3 noted, studying can become a pursuit of points.`},normies:{title:`Normies`,text:`Nobody failed. Nobody complained. Nobody remembers. The course was... fine.`},deans_office:{title:`The Dean's Office`,text:`Appeals, complaints, a meeting with no chair for you. Your contract was not renewed.`},burnout:{title:`Burnout`,text:`You made an exception for everyone and a system for no one. By week 15 you were running on coffee and guilt.`}};function f(e){let t=l(e,`trust`);return t>=60?`Artyom ran for class rep again, "because this course actually listened."`:t<45?`Artyom started an anonymous feedback channel. It filled up in a day.`:`Artyom wrote "it was okay" in the course survey. He meant it.`}function p(e,t){let n=e.students[t],r=e.flags;return t===`akmaral`?r.has(`ak_fair`)&&n.trust>=55?{title:`Teaching Assistant`,text:`Graded fairly, she stayed. Next year she runs the seminar you used to run.`,ex:`happy`}:n.trust<40?{title:`"Unfair."`,text:`She stopped carrying teams. Her course review was one word long.`,ex:`angry`}:{title:`Quietly Excellent`,text:`Top marks, polite nods. She never stayed after class again.`,ex:`neutral`}:t===`madiyar`?r.has(`md_explained`)?{title:`Actually Gets It`,text:`Made to explain his part, he found out he likes the subject. Annoying, but true.`,ex:`happy`}:n.motivation<35?{title:`Dropped Out`,text:`Called out with no way back in, he stopped showing up.`,ex:`sad`}:{title:`Same Grade, No Regrets`,text:`Same grade as Akmaral. Learned nothing. Feels great about it.`,ex:`bored`}:t===`rakhat`?r.has(`rk_strict`)?{title:`Retook the Course`,text:`Sick, then late, then a zero. He passed the next year. He still mentions it.`,ex:`sad`}:r.has(`rk_quiet`)?{title:`The Negotiator`,text:`Word got around that deadlines can be "discussed". By May, half the class was negotiating.`,ex:`happy`}:r.has(`rk_rule`)?{title:`Back on Track`,text:`One clear rule for everyone who was ill. He used it once, and nobody called it favouritism.`,ex:`happy`}:r.has(`rk_revise`)?{title:`Better Second D
